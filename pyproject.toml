[project]
name = "dayforge"
version = "0.1.0"
description = "Self-hosted system where AI agents build software projects day by day, controlled from Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "jinja2>=3.1",
    "mcp>=1.20",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Комментарии и строки на русском: кириллица — не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# В тестах блокирующий файловый ввод-вывод внутри async — норма.
"tests/**" = ["ASYNC230", "ASYNC240"]
